<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#140f2e">
  <title>PartyPad · Mando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/shared/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-vista="cargando">
  <div class="fondo" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

  <section class="vista vista-cargando" aria-live="polite">
    <p class="logo logo-mando">Party<span>Pad</span></p>
    <p class="suave">Conectando…</p>
  </section>

  <section class="vista vista-codigo">
    <p class="logo logo-mando">Party<span>Pad</span></p>
    <form id="form-codigo" class="formulario" autocomplete="off">
      <label for="campo-codigo">Código de la sala</label>
      <input id="campo-codigo" class="campo campo-codigo" maxlength="4" inputmode="text"
             autocapitalize="characters" spellcheck="false" placeholder="ABCD" required>
      <p id="error-codigo" class="error" role="alert"></p>
      <button class="boton boton-grande" type="submit">Entrar</button>
    </form>
    <p class="suave pie">El código aparece en la pantalla grande</p>
  </section>

  <section class="vista vista-perfil">
    <form id="form-perfil" class="formulario perfil" autocomplete="off">
      <p class="sala-etiqueta">Sala <strong id="perfil-sala"></strong></p>
      <span id="vista-previa" class="avatar vista-previa">?</span>
      <label for="campo-nombre">Tu nombre</label>
      <input id="campo-nombre" class="campo" maxlength="16" placeholder="¿Cómo te llamas?" required>
      <fieldset class="colores">
        <legend>Elige tu color</legend>
        <div id="colores" class="paleta"></div>
      </fieldset>
      <p id="error-perfil" class="error" role="alert"></p>
      <button id="unirme" class="boton boton-grande" type="submit">¡Unirme!</button>
    </form>
  </section>

  <section class="vista vista-espera">
    <div class="espera">
      <span id="espera-avatar" class="avatar avatar-grande">?</span>
      <h1 id="espera-nombre" class="nombre-grande"></h1>
      <p class="listo">¡Ya estás dentro!</p>
      <p class="suave">Mira la pantalla grande. La partida empezará cuando el anfitrión quiera.</p>
      <p class="sala-etiqueta">Sala <strong id="espera-sala"></strong></p>
    </div>
    <button id="salir" class="boton boton-secundario pie" type="button">Salir de la sala</button>
  </section>

  <section class="vista vista-partida">
    <p class="jugador-partida"><span id="partida-avatar" class="avatar"></span><span id="partida-nombre"></span></p>
    <button id="boton" class="boton-juego" type="button" aria-label="Botón A">A</button>
  </section>

  <section class="vista vista-mensaje">
    <div class="mensaje">
      <p id="mensaje-icono" class="mensaje-icono" aria-hidden="true"></p>
      <h1 id="mensaje-titulo"></h1>
      <p id="mensaje-texto" class="suave"></p>
      <button id="mensaje-boton" class="boton boton-grande" type="button"></button>
    </div>
  </section>

  <div id="aviso-pantalla" class="aviso-pantalla" role="status" hidden>La pantalla grande se ha desconectado</div>
  <div id="reconectando" class="reconectando" hidden><p>Reconectando…</p></div>

  <script type="module" src="main.js"></script>
</body>
</html>
